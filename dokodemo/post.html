<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog · Taeyoon Kim</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/shared/avatar.svg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <a href="/" class="logo">Taeraemon</a>
      <div class="menu">
        <a href="/dokodemo/">← Logs</a>
      </div>
    </nav>

    <article class="post">
      <p class="post-meta" id="meta"></p>
      <h1 class="page-title" id="title"></h1>
      <div class="prose" id="body"><p class="empty">Loading…</p></div>
    </article>

    <footer><a href="/dokodemo/">← All logs</a></footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script>
    (async () => {
      const slug = new URLSearchParams(location.search).get("p") || "";
      const body = document.getElementById("body");
      const posts = await fetch("posts.json", { cache: "no-cache" }).then(r => r.json());
      const post = posts.find(x => x.slug === slug);
      if (!post) { body.innerHTML = '<p class="empty">Post not found.</p>'; return; }

      let md = await fetch(`posts/${slug}.md`, { cache: "no-cache" }).then(r => r.text());

      // Pull math out before markdown so marked doesn't eat _ and \, then put rendered KaTeX back.
      const math = [];
      const keep = (tex, display) => {
        math.push(katex.renderToString(tex, { displayMode: display, throwOnError: false }));
        return `@@MATH${math.length - 1}@@`;
      };
      md = md.replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => keep(t, true))
             .replace(/\$([^\n$]+?)\$/g, (_, t) => keep(t, false));

      body.innerHTML = marked.parse(md).replace(/@@MATH(\d+)@@/g, (_, i) => math[i]);
      document.getElementById("title").textContent = post.title;
      document.getElementById("meta").textContent = `${post.date} · ${post.tag}`;
      document.title = `${post.title} · Blog`;
    })();
  </script>
</body>
</html>
